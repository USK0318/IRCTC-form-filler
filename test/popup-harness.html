<!doctype html>
<!-- Renders the real popup.html with in-memory chrome.* stubs (UI testing only).
     Open http://localhost:8765/test/popup-harness.html -->
<meta charset="utf-8">
<script>
(function () {
  const store = {};
  const listeners = [];
  const clone = (v) => (v === undefined ? undefined : JSON.parse(JSON.stringify(v)));
  window.__store = store;
  window.__lastMessage = null;
  window.chrome = {
    runtime: { getManifest: () => ({ version: "test", content_scripts: [{ js: [] }] }) },
    storage: {
      local: {
        async get(keys) { const out = {}; [].concat(keys).forEach((k) => { if (k in store) out[k] = clone(store[k]); }); return out; },
        async set(items) { const changes = {}; for (const [k, v] of Object.entries(items)) { changes[k] = { oldValue: store[k], newValue: v }; store[k] = clone(v); } listeners.forEach((fn) => fn(changes, "local")); },
        async clear() { Object.keys(store).forEach((k) => delete store[k]); listeners.forEach((fn) => fn({}, "local")); },
      },
      onChanged: { addListener: (fn) => listeners.push(fn) },
    },
    tabs: {
      async query() { return [{ id: 1, url: "https://www.irctc.co.in/nget/booking/psgninput" }]; },
      async sendMessage(_id, msg) {
        window.__lastMessage = msg;
        if (msg.type === "PING") return { ok: true, onBookingPage: true, rows: { adults: 1, infants: 0 } };
        return { action: "fill", summary: { ok: 9, info: 1, warn: 1, error: 0 }, items: [
          { status: "warn", scope: "Passenger 2", field: "Berth preference", message: "Matching option not available — set it manually." },
          { status: "info", scope: "Contact", field: "Mobile number", message: "Already filled by IRCTC — kept." },
          { status: "ok", scope: "Passenger 1", field: "Name", message: "" } ] };
      },
    },
    scripting: { async executeScript() {} },
  };
  fetch("/popup.html").then((r) => r.text()).then((html) => {
    document.open();
    document.write(html.replace("<head>", '<head><base href="/">'));
    document.close();
  });
})();
</script>
